<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генерация актов</title>
    <link rel="stylesheet" href="style.css">
</head>
        <body>
            <form  action="/create-act" method="POST">
                <datalist id="positionsData"></datalist>
                
                <label>ФИО сотрудника</label>
                <input type="text" name="fullNameS">

                <label>Должность сотрудника</label>
                <input type="text" name="jobTitle" id="list" list="positionsData">

                <label>ФИО мат.ответсвенного</label>
                <input type="text" name="fullNameR">

                <label>Должность мат.ответственного</label>
                <input type="text" name="jobTitleR" id="listR" list="positionsData">

                <label>Модель ноутбука</label>
                <input type="text" name="model">

                <label>Серийный номер</label>
                <input type="text" name="serial">

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Сгенерировать акт</span>
                    <div class="loader" id="btnLoader"></div>
                </button>
            </form>
        </body>
<script src="Animations.js"></script>
</html>
